<!DOCTYPE html><html lang="mk"><head><meta charset="utf-8"><title>Тестирање на софтвер – квиз</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--card:#f3f4f8;--tx:#1b1d29;--mu:#666b80;--ac:#5b6ef5;--ok:#1f9d55;--no:#d64545;--bd:#d9dce8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161c;--card:#1f2029;--tx:#eceef6;--mu:#9aa0b8;--ac:#8493ff;--ok:#3ecf7a;--no:#ff6b6b;--bd:#33354a;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:20px}
main{max-width:720px;margin:auto}h1{font-size:24px;margin:0 0 4px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:16px}
h3{margin:14px 0 8px;font-size:15px}.row{display:flex;flex-wrap:wrap;gap:8px}
.chip,.opt,.go{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.go{background:var(--ac);color:#fff;border-color:var(--ac);margin-top:18px;padding:10px 22px;font-weight:600}
.opt{display:block;width:100%;text-align:left;border-radius:10px;margin-top:8px;padding:11px 14px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.src{font-size:13px;color:var(--mu);margin:10px 0 4px}
</style></head><body><main id="app"></main>
<script>
const G={L1:"Предавање 1: Принципи",L2:"Предавање 2: Животен циклус",L3:"Предавање 3: Статичко тестирање",L4:"Предавање 4: Динамичко тестирање",A1:"Вежби 1: Статичка анализа",A2:"Вежби 2: Unit тестирање",A3:"Вежби 3: Интеграциско тестирање",A4:"Вежби 4: AI-асистирано тестирање",A5:"Вежби 5: Динамичко тестирање"};
const Q=`L1|Што е „грешка“ (error) во терминологијата на тестирањето?|Човечка акција што дава неточен резултат|Дефект во кодот|Отстапување на софтверот при работа|Неуспешен тест
L1|Failure (откажување) е:|Настан во кој софтверот отстапува од очекуваното|Состојба на софтверот предизвикана од грешка|Човечка грешка на програмерот|Пропуст во планот за тестирање
L1|Најважен принцип кога времето е ограничено:|Приоритизирање по ризик, за да е тестирањето најдобро кога и да запреш|Тестирање по ред|Прво лесните случаи|Запирање кога тестерите се уморни
L1|Колку тестирање е доволно?|Зависи од ризикот|Додека не се најде последниот баг|Секогаш 100% покриеност|Колку што реши програмерот
L1|Исцрпно тестирање значи:|Сите комбинации на влезови и предуслови|Сите планирани тестови|Сите гранки|Сите тестери се исцрпени
L1|Очекуваниот резултат се одредува:|Однапред, при дизајн на тестот|По гледање на излезот|Според тоа што изгледа веродостојно|Од самиот софтвер
L1|Ре-тестирање наспроти регресиско тестирање:|Ре-тест потврдува поправка; регресија бара несакани ефекти|Исто се|Регресија потврдува поправка; ре-тест бара несакани ефекти|Ре-тест е секогаш автоматски
L1|Кога го тестираш сопственото дело, обично наоѓаш околу:|30–50% од сопствените грешки|100%|90%|Под 5%
L2|Што покажува V-моделот?|Секое ниво на тестирање одговара на фаза од развојот|Само редослед на кодирање|Дека тестирањето е само на крај|Само акцептно тестирање
L2|Stub е:|Замена за повикана компонента што уште не е интегрирана|Програма што ја повикува компонентата|Алатка за покриеност|Тип на преглед
L2|Driver се користи кај:|Bottom-up интеграција, за повик на компонентите|Top-down, за симулација на пониски нивоа|Alpha тестирање|Инспекција
L2|Зошто е проблематична big-bang интеграцијата?|Потешко се лоцираат и поправаат грешките|Бара драјвери|Не е можна|Е премногу брза
L2|Alpha наспроти Beta тестирање:|Alpha кај развивачот, Beta кај клиентот|Alpha кај клиентот, Beta кај развивачот|Двете кај развивачот|Нема разлика
L2|Maintenance тестирање е претежно:|Регресиско, со анализа на влијание|Само ново функционално|Само UI|Не е потребно
L2|Stress тест:|Оди над границите на системот за да се види што ќе се случи|Мери време на одговор|Проверува лозинки|Проверува инсталација
L2|Без спецификација можеш да:|Валидираш, но не и верификуваш|Верификуваш, но не и валидираш|И едното и другото|Ништо
L3|Статичките техники:|Не го извршуваат кодот|Го извршуваат со тест податоци|Мерат покриеност на гранки|Работат само на код
L3|Најформален преглед, наменет за наоѓање грешки:|Инспекција|Walkthrough|Неформален преглед|Desk-checking
L3|Walkthrough служи првенствено за:|Едукација: авторот го води тимот низ документот|Метрики и излезни критериуми|Мерење покриеност|Автоматско наоѓање грешки
L3|Цикломатска сложеност =|Број на одлуки + 1|Број на изрази|Број на линии|Број на функции
L3|Ограничување на статичката анализа:|Може да создаде многу лажни пораки|Го извршува кодот|Не наоѓа недостижен код|Бара корисник
L3|Технички (peer) преглед:|Вклучува колеги и експерти, без менаџмент|Секогаш со менаџмент|Нема документација|Е исто што и инспекција
L3|Прегледите обично чинат:|5–15% од развојниот напор|50%|Над 100%|Ништо
L4|Еквивалентно партиционирање (EP):|Влезовите се делат на еквивалентни групи, по една вредност од група|Се тестира секоја вредност|Се тестираат само граници|Се тестира само код
L4|Анализа на гранични вредности (BVA):|Се тестираат вредности од двете страни на границата|Само средина на партиција|Само невалидни вредности|Случајни вредности
L4|Износ на заем £500–£9000. Гранични вредности:|499, 500, 9000, 9001|500 и 9000|0 и 10000|4999 и 5000
L4|Во табела на одлуки цртичката „-“ значи:|Условот е небитен за тоа правило|Непознато|Невалидно|Грешка
L4|Statement coverage =|Извршени изрази / вкупно изрази|Исходи на одлуки|Број на тестови|Број на функции
L4|100% покриеност:|Не значи 100% тестирано|Значи нема грешки|Е совршен тест|Гарантира коректност
L4|Decision (branch) coverage мери:|Процент на true/false исходи на одлуки|Само изрази|Само функции|Само линии
L4|Бела кутија се користи претежно на:|Пониски нивоа (компонентно)|Акцептно ниво|Само системско|Само UI
L4|Зошто и EP и BVA?|Ако падне тест, треба да се знае дали е погрешна партицијата или границата|Е излишно|Границите ги покриваат партициите|Само за UI
A1|Pylint E0602 (customer_email):|Пад на патеката за непознат клиент (NameError), прво поправка|Козметика|Недостасува документација|Лажен аларм
A1|Зошто е опасно audit=[]?|Листата се дели меѓу повици; поправка: audit=None|Бавно е|Не се компајлира|Нема проблем
A1|Bandit B608 пријавува:|Можна SQL injection; поправка: bound параметри|Лошо именување|Недостасува docstring|Неискористен import
A1|Чист Pylint извештај (10/10) значи:|Нема овозможени наоди во анализираниот опсег, но не докажува деловна коректност|Кодот е коректен|Нема сигурносни проблеми|Преглед не е потребен
A1|Severity и confidence кај Bandit:|Severity = потенцијално влијание, confidence = сигурност на детекција|Исто се|Confidence = влијание|Severity = брзина
A1|Неуспешен pre-commit hook:|Го запира локалниот commit; автоматските измени се прегледуваат и се стејџираат|Прави commit|Прави push|Го брише кодот
A1|Што открива рачниот преглед на попустот?|> 10000 наместо >= 10000; данокот е на погрешна основа|SQL injection|Неискористен import|Недостасува docstring
A2|AAA структура на тест:|Arrange, Act, Assert|Add, Apply, Approve|Assert, Act, Arrange|Analyze, Assert, Archive
A2|Редослед на аргументи кај assertEquals:|(expected, actual)|(actual, expected)|(message, value)|Секој
A2|Што се извршува пред секој тест?|@BeforeEach / setUp() / дел од fixture пред yield|@BeforeAll|tearDown()|Ништо
A2|Параметризиран тест во pytest:|@pytest.mark.parametrize|@pytest.fixture|@patch|@unittest.skip
A2|Тестирање на исклучок во pytest:|with pytest.raises(...)|assert raises|Само try/except|@timeout
A2|Stub наспроти mock:|Stub дава одговор, mock може и да ги верифицира интеракциите|Исто се|Mock само враќа вредност|Stub проверува повици
A2|assertTimeout (JUnit):|Проверува поминато време откако извршувањето ќе заврши|Прекинува висечки тест|Мери меморија|Скокнува тест
A2|Добар unit тест:|Независен од редослед и надворешни сервиси, јасно кажува што е прекршено|Зависи од база|Секогаш има 100% покриеност|Користи реален мрежен сервис
A3|Mock на repository во тест:|Не го проверува SQL и мапирањето|Го проверува SQL|Е интеграциски тест|Користи реална база
A3|flush() и clear():|flush праќа чекачки записи, clear го празни persistence context|clear праќа, flush празни|Исто се|Бришат табела
A3|@DataJpaTest по default:|Ја враќа (rollback) тест-трансакцијата|Прави commit|Стартува сервер|Користи PostgreSQL
A3|Кај RANDOM_PORT тест:|Серверските commit-и не се враќаат; треба чистење или изолирана база|Сè се враќа автоматски|Нема сервер|Нема HTTP
A3|HTTP статус 201 сам по себе:|Не докажува правилно зачувување во база|Докажува сè|Заменува проверка на база|Е договор
A3|SQLite/H2 тестови:|Не докажуваат компатибилност со PostgreSQL/MySQL|Ја докажуваат|Се исти со продукција|Бараат mock
A3|Името (*IT, маркер):|Контролира откривање, не стварното ниво на тестот|Го одредува нивото|Заменува граница|Е небитно
A3|Тест на UNIQUE ограничување очекува:|IntegrityError / DataIntegrityViolationException|Статус 200|Mock|Нема исклучок
A4|Test oracle е:|Механизам што одлучува дали резултатот е коректен|Тест-алатка|Mock|Мерка на покриеност
A4|Копирање на продукциската формула во тестот:|Ги повторува нејзините грешки|Е најдобра пракса|Е независен оракул|Нема ефект
A4|assertTrue(fee >= 0) е слаб затоа што:|Не ги проверува точните износи|Не се компајлира|Е премногу строг|Е бавен
A4|Контролирано вбризгување грешка (>= во >):|Прегледаните точни тврдења треба да паднат|Слабите тестови паѓаат|Ништо не паѓа|Паѓа компајлерот
A4|mock(ShipmentService) па тестирање на book():|Се извршува само mock, не продукциско однесување|Тестира сервис|Тестира база|Најдобра пракса
A4|Граница за service unit тест:|Реален сервис, mock repository и gateway|Сè реално|Сè mock|Mock на методот што се евалуира
A4|Менување на очекуваната вредност кога тест паѓа:|Може да ги избрише доказите за дефект|Секогаш е точно|Е препорачано|Подобрува оракул
A4|Python Mock со typo (cretae):|Го прифаќа; create_autospec со spec_set=True го фаќа|Фрла грешка|Е безбеден|Не се користи
A5|Зошто се менува само едно невалидно поле по случај?|За да е јасно кое правило падна|Побрзо е|Нема причина|Мора по спецификација
A5|Граници за тежина 100–20000 g:|99, 100, 101, 19999, 20000, 20001|100 и 20000|0 и 20001|99 и 20001
A5|Поштенски код „00123“ се чува како:|Стринг (водечките нули се значајни)|Цел број|Float|Boolean
A5|Три Boolean услови даваат:|8 комбинации|3|6|9
A5|Еден случај (oversized, express, insured = true) покрива:|Сите изрази (750 центи), но не сите исходи|Сите гранки|Ниеден израз|Само fee = 100
A5|Три одлуки, шест исходи. Минимум случаи за гранки:|3|1|6|2
A5|Short-circuit: „NE“ (not evaluated) е:|Не е false|Е false|Е true|Грешка
A5|Две одлуки: цикломатска 3, а изводливи патеки:|4|3|2|1
A5|Пример за error guessing:|ASCII цртичка наспроти en dash, празна референца|Само граници|Само mock|Само партиции`.split("\n").map(l=>{const p=l.split("|");return{g:p[0],q:p[1],a:p[2],o:p.slice(2)}});
const $=document.getElementById("app"),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let mode="M",sel=new Set(Object.keys(G)),cnt=0,qs=[],i=0,sc=0,done=false;
const ids=()=>Object.keys(G).filter(k=>mode=="M"||k[0]==mode);
function menu(){const L=ids(),pool=Q.filter(q=>sel.has(q.g)&&L.includes(q.g));
$.innerHTML=`<h1>Тестирање на софтвер – вежбање</h1><div class="mu">Вкупно ${Q.length} прашања. Тастатура: 1–4 за одговор, Enter за следно.</div><div class="card"><h3>Извор</h3><div class="row">${[["L","Предавања"],["A","Аудиториски"],["M","Мешано"]].map(([k,t])=>`<button class="chip ${mode==k?"on":""}" data-m="${k}">${t}</button>`).join("")}</div><h3>Презентации</h3><div class="row">${L.map(k=>`<button class="chip ${sel.has(k)?"on":""}" data-g="${k}">${G[k]} (${Q.filter(q=>q.g==k).length})</button>`).join("")}</div><h3>Број на прашања</h3><div class="row">${[0,10,20,50].map(n=>`<button class="chip ${cnt==n?"on":""}" data-n="${n}">${n?n:"Сите ("+pool.length+")"}</button>`).join("")}</div><p class="mu">Прашањата и одговорите секогаш се мешаат по случаен редослед.</p><button class="go" ${pool.length?"":"disabled"} id="st">Започни квиз</button></div>`;
$.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;sel=new Set(ids());menu()});
$.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;sel.has(g)?sel.delete(g):sel.add(g);menu()});
$.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{cnt=+b.dataset.n;menu()});
document.getElementById("st").onclick=()=>{qs=sh(pool);if(cnt)qs=qs.slice(0,cnt);i=0;sc=0;show()}}
function show(){done=false;if(i>=qs.length){const p=Math.round(100*sc/qs.length);$.innerHTML=`<h1>Резултат</h1><div class="card"><h2>${sc} / ${qs.length} (${p}%)</h2><button class="go" id="rs">Нов квиз</button></div>`;document.getElementById("rs").onclick=menu;return}
const q=qs[i],o=sh(q.o);$.innerHTML=`<div class="mu">Прашање ${i+1} од ${qs.length} · точни: ${sc}</div><div class="bar"><i style="width:${100*i/qs.length}%"></i></div><div class="card"><div class="src">${G[q.g]}</div><h2 style="margin:0 0 6px;font-size:19px">${q.q}</h2>${o.map((t,k)=>`<button class="opt" data-t="${k}">${k+1}. ${t}</button>`).join("")}<div id="nx"></div></div>`;
const bs=[...$.querySelectorAll(".opt")];window.pick=k=>{if(done)return;done=true;bs.forEach((b,j)=>{const r=o[j]==q.a;if(r)b.classList.add("ok");else if(j==k)b.classList.add("no");b.disabled=true});if(o[k]==q.a)sc++;document.getElementById("nx").innerHTML=`<button class="go" id="nb">${i+1<qs.length?"Следно":"Резултат"}</button>`;document.getElementById("nb").onclick=()=>{i++;show()}};
bs.forEach((b,k)=>b.onclick=()=>pick(k))}
document.onkeydown=e=>{if(!qs.length||!$.querySelector(".opt"))return;if(e.key>="1"&&e.key<="4")pick(+e.key-1);else if(e.key=="Enter"&&done){i++;show()}};
menu();
</script></body></html>
