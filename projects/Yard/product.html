<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — The Yard Lounge Bar</title>
  <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg" href="logo.svg">

</head>
<body>

  <nav>
    <a href="index.html" class="logo">
        <img src="logo.svg" alt="" width="55px" height="55px">
      The Yard
    </a>
    <ul>
      <li><a href="menu.html">Мени</a></li>
      <li><a href="index.html#hours">Работно Време</a></li>
      <li><a href="index.html#kontakt">Контакт</a></li>
    </ul>
  </nav>


  <main class="product-page" id="product-root">

    <div class="nazad">
      <a href="menu.html" class="btn small">Назад во мрни</a>
    </div>

    <article class="product-kocka">

      <div class="product-image-wrap">
        <img id="product-image" src="" alt="" class="product-image">
      </div>

      <div class="product-info">
        <p class="product-category" id="product-category">Kategorija</p>
        <h1 class="product-name" id="product-name">Ime na produkt</h1>
        <div class="product-divider"></div>

        <p class="product-cena" id="product-cena">0.00</p>

        <div class="product-section">
          <h2>ОПИС</h2>
          <p id="product-informacije"></p>
        </div>

        <div class="product-section">
          <h2>Состојки</h2>
          <ul id="product-sostojki" class="sostojki-list">
            <li>Состојки</li>
          </ul>
        </div>
        

        <div class="product-section">
          <h2>Детаили</h2>
          <p id="product-opis"></p>
        </div>
      </div>

    </article>

  </main>

  <footer>
    &copy; 2026 The Yard Lounge Bar 
  </footer>

  <script src="products.js"></script>
</body>
</html>
